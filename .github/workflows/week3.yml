name: Week 3 verifier

# Fine-tunes an NLI cross-encoder on SciFact train and evaluates it (and the untuned model) on the
# clean corpus and all 12 Week 2 corrupted corpora, reusing each run's committed dense rankings.
# Runs in fp32, so any CPU runner works. Results are committed to results/week3/; the fine-tuned
# model is kept as a workflow artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/week3.yml]

permissions:
  contents: write

jobs:
  week3:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch, versions pinned in requirements.txt)
        run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nli-deberta-v3-xsmall
      - name: Download SciFact
        run: python week1_baseline.py --step download
      - name: Train, evaluate, summarise
        run: python week3_verifier.py all
      - uses: actions/upload-artifact@v4
        with:
          name: nli_finetuned
          path: models/nli_finetuned/
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/week3/
          git diff --cached --quiet && { echo "No new results"; exit 0; }
          git commit -m "Week 3: NLI verifier results (GitHub Actions run ${{ github.run_id }})"
          git pull --rebase origin main
          git push origin HEAD:main
