name: Week 3 verifier and reranker

# Fine-tunes the NLI verifier with three training seeds and a cross-encoder reranker on SciFact
# train, evaluates them (and the untuned models) on the clean corpus and all 12 Week 2 corrupted
# corpora, reusing each run's committed dense rankings, and commits results/week3/. Runs in fp32,
# so any CPU runner works. Fine-tuned models are kept as workflow artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/week3.yml]

permissions:
  contents: write

env:
  SETUP: |
    pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
    pip install -r requirements.txt

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch, versions pinned in requirements.txt)
        run: eval "$SETUP"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-week3-v2
      - name: Download SciFact
        run: python week1_baseline.py --step download
      - name: Train and evaluate (seed ${{ matrix.seed }})
        run: |
          python week3_verifier.py train --seed ${{ matrix.seed }}
          python week3_verifier.py evaluate --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: results-verifier-seed${{ matrix.seed }}
          path: results/week3/
      - uses: actions/upload-artifact@v4
        with:
          name: model-nli-finetuned-seed${{ matrix.seed }}
          path: models/nli_finetuned_seed${{ matrix.seed }}/

  reranker:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch, versions pinned in requirements.txt)
        run: eval "$SETUP"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-week3-reranker
      - name: Download SciFact
        run: python week1_baseline.py --step download
      - name: Train and rerank
        run: |
          python week3_reranker.py train
          python week3_reranker.py rerank
      - uses: actions/upload-artifact@v4
        with:
          name: results-reranker
          path: results/week3/
      - uses: actions/upload-artifact@v4
        with:
          name: model-reranker-finetuned
          path: models/reranker_finetuned/

  reranked-verification:
    needs: [verifier, reranker]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch, versions pinned in requirements.txt)
        run: eval "$SETUP"
      - name: Download SciFact
        run: python week1_baseline.py --step download
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results/week3/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: model-nli-finetuned-seed0
          path: models/nli_finetuned_seed0/
      - name: Verify from reranked top-3, summarise
        run: |
          python week3_reranker.py verify
          python week3_verifier.py summary
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A results/week3/
          git diff --cached --quiet && { echo "No new results"; exit 0; }
          git commit -m "Week 3: verifier seeds and reranker results (GitHub Actions run ${{ github.run_id }})"
          git pull --rebase origin main
          git push origin HEAD:main
